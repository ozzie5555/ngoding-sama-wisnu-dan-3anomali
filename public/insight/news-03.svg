    <text x="185" y="80" fill="#FFF" font-size="14" font-weight="bold" text-anchor="middle">PLASTIK</text>

    <rect x="250" y="30" width="100" height="220" rx="8" fill="#334155" stroke="#64748B" stroke-width="2"/>
