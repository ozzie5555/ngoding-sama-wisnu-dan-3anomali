    <rect x="20" y="30" width="100" height="220" rx="8" fill="#334155" stroke="#64748B" stroke-width="2"/>
    <rect x="35" y="50" width="70" height="50" rx="4" fill="#0197D2"/>
    <text x="70" y="80" fill="#FFF" font-size="14" font-weight="bold" text-anchor="middle">KERTAS</text>

    <rect x="135" y="30" width="100" height="220" rx="8" fill="#334155" stroke="#64748B" stroke-width="2"/>
