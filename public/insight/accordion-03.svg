<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="100%" height="100%">
  <rect width="320" height="240" rx="12" fill="#E8F4F8"/>
  <g transform="translate(90, 30)">
    <!-- Tin can container -->
    <rect x="40" y="70" width="60" height="90" rx="8" fill="#CBD5E1" stroke="#0197D2" stroke-width="2"/>
    <ellipse cx="70" cy="70" rx="30" ry="8" fill="#94A3B8"/>
    <ellipse cx="70" cy="160" rx="30" ry="8" fill="#CBD5E1"/>
    <!-- Decorative wrapped string / label -->
    <rect x="40" y="100" width="60" height="30" fill="#0197D2"/>
    <line x1="45" y1="115" x2="95" y2="115" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="3,3"/>
    <!-- Pencils and brushes sticking out -->
    <line x1="55" y1="20" x2="65" y2="80" stroke="#F59E0B" stroke-width="5" stroke-linecap="round"/>
    <line x1="70" y1="15" x2="70" y2="80" stroke="#3FBEC7" stroke-width="6" stroke-linecap="round"/>
    <line x1="85" y1="25" x2="75" y2="80" stroke="#808964" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>
