<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="100%" height="100%">
  <rect width="320" height="240" rx="12" fill="#FAF6ED"/>
  <!-- Cardboard desktop organizer -->
  <g transform="translate(60, 30)">
    <rect x="20" y="40" width="160" height="130" rx="8" fill="#E2D4B7" stroke="#A38B62" stroke-width="2"/>
    <!-- Compartments -->
    <rect x="30" y="50" width="40" height="50" rx="4" fill="#FFF" stroke="#A38B62" stroke-width="1.5"/>
    <rect x="80" y="50" width="90" height="50" rx="4" fill="#FFF" stroke="#A38B62" stroke-width="1.5"/>
    <rect x="30" y="110" width="140" height="50" rx="4" fill="#FFF" stroke="#A38B62" stroke-width="1.5"/>
    <!-- Pencil mockup inside slot -->
    <line x1="45" y1="20" x2="45" y2="70" stroke="#0197D2" stroke-width="4" stroke-linecap="round"/>
    <line x1="55" y1="25" x2="55" y2="70" stroke="#3FBEC7" stroke-width="4" stroke-linecap="round"/>
    <!-- Pull knob -->
    <circle cx="100" cy="135" r="5" fill="#A38B62"/>
  </g>
</svg>
