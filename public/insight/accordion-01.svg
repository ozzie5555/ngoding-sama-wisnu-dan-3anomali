<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="100%" height="100%">
  <rect width="320" height="240" rx="12" fill="#E8F8F5"/>
  <g transform="translate(60, 20)">
    <!-- 3 cute little plant pots made of bottles -->
    <g transform="translate(0, 30)">
      <rect x="15" y="60" width="45" height="55" rx="8" fill="#FFF" stroke="#248689" stroke-width="2"/>
      <circle cx="28" cy="85" r="3" fill="#062632"/>
      <circle cx="48" cy="85" r="3" fill="#062632"/>
      <path d="M34 95 Q38 100 42 95" stroke="#062632" stroke-width="1.5" fill="none"/>
      <!-- Sprout -->
      <path d="M37 60 C25 40 20 20 37 15 C45 30 40 50 37 60 Z" fill="#808964"/>
      <path d="M37 60 C50 40 55 20 37 15" stroke="#3FBEC7" stroke-width="2" fill="none"/>
    </g>
    <g transform="translate(70, 20)">
      <rect x="15" y="70" width="45" height="55" rx="8" fill="#DDF3EE" stroke="#0197D2" stroke-width="2"/>
      <circle cx="28" cy="95" r="3" fill="#062632"/>
      <circle cx="48" cy="95" r="3" fill="#062632"/>
      <!-- Cactus -->
      <path d="M37 70 L37 30 C37 20 45 20 45 30 L45 70 Z" fill="#248689"/>
      <path d="M30 45 L37 45" stroke="#248689" stroke-width="3" stroke-linecap="round"/>
      <path d="M45 55 L52 55" stroke="#248689" stroke-width="3" stroke-linecap="round"/>
    </g>
    <g transform="translate(140, 35)">
      <rect x="15" y="55" width="45" height="55" rx="8" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
      <!-- Flowers -->
      <circle cx="37" cy="40" r="12" fill="#F59E0B"/>
      <circle cx="37" cy="40" r="6" fill="#FFF"/>
      <path d="M37 55 L37 30" stroke="#808964" stroke-width="3"/>
    </g>
