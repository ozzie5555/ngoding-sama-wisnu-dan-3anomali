<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="100%" height="100%">
  <defs>
    <linearGradient id="v1grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B"/>
      <stop offset="100%" stop-color="#022C22"/>
    </linearGradient>
  </defs>
  <rect width="480" height="270" rx="12" fill="url(#v1grad)"/>
  <circle cx="240" cy="135" r="70" fill="#10B981" fill-opacity="0.15"/>
  <circle cx="240" cy="135" r="50" fill="#34D399" fill-opacity="0.25"/>
  <!-- Circular progress text banner -->
  <text x="30" y="80" fill="#6EE7B7" font-size="28" font-weight="900" font-family="sans-serif">Re-thinking</text>
  <text x="30" y="120" fill="#FFFFFF" font-size="36" font-weight="900" font-family="sans-serif">progress</text>
  <!-- YouTube big red play button in center -->
  <g transform="translate(205, 105)">
    <rect width="70" height="50" rx="14" fill="#FF0000"/>
    <polygon points="28,15 50,25 28,35" fill="#FFFFFF"/>
  </g>
  <!-- Watch on YouTube pill -->
  <g transform="translate(320, 220)">
    <rect width="145" height="36" rx="18" fill="#18181B" fill-opacity="0.9"/>
    <text x="18" y="23" fill="#FFF" font-size="11" font-weight="bold" font-family="sans-serif">Watch on</text>
    <text x="80" y="23" fill="#FF0000" font-size="11" font-weight="bold" font-family="sans-serif">YouTube</text>
  </g>
</svg>
