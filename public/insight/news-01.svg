<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="100%" height="100%">
  <rect width="600" height="350" rx="16" fill="#475569"/>
  <!-- Broken building silhouette / earthquake disaster visual -->
  <path d="M0 250 L100 220 L180 270 L260 210 L340 260 L420 190 L500 240 L600 200 L600 350 L0 350 Z" fill="#1E293B"/>
  <path d="M50 180 L120 180 L110 240 L40 240 Z" fill="#334155"/>
  <path d="M220 150 L290 160 L270 230 L210 220 Z" fill="#334155"/>
  <path d="M400 130 L480 140 L460 210 L390 200 Z" fill="#334155"/>
  <!-- Crack lines -->
  <path d="M150 350 L180 300 L160 260 L200 220" stroke="#F87171" stroke-width="3" fill="none"/>
  <path d="M420 350 L450 280 L430 240 L470 190" stroke="#F87171" stroke-width="3" fill="none"/>
  <!-- Warning badge -->
  <g transform="translate(480, 30)">
    <circle cx="40" cy="40" r="30" fill="#EF4444" fill-opacity="0.9"/>
    <text x="40" y="48" font-size="28" font-weight="bold" fill="#FFF" text-anchor="middle">!</text>
  </g>
  <text x="30" y="310" fill="#F1F5F9" font-size="18" font-weight="600" font-family="sans-serif">DOKUMENTASI SITUASI BENCANA NAGEKEO</text>
</svg>
